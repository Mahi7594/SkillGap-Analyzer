{% extends 'gap_analysis/base.html' %}

{% block title %}Log in — Skill Gap Analyzer{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card animate-fade-in">
            <div class="card-header text-center">
                <i class="bi bi-bar-chart-fill me-2"></i>Skill Gap Analyzer
            </div>
            <div class="card-body">
                <h5 class="mb-3">Log in</h5>
                {% if form.errors %}
                <div class="alert alert-danger">Incorrect username or password.</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username" class="form-control" autofocus required>
                    </div>
                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password" class="form-control" required>
                    </div>
                    <input type="hidden" name="next" value="{{ next }}">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Log in
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
